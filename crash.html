<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>STRESS MY GPU - OVERLOAD EDITION</title>
<style>
  body { margin:0; overflow:hidden; background:#000; color:#0f0; font-family:Arial, sans-serif; }
  #ui { position:absolute; top:10px; left:10px; z-index:10; background:rgba(0,0,0,0.7); padding:15px; border:2px solid #0f0; border-radius:8px; max-width:320px; }
  h1 { margin:0 0 10px; font-size:28px; text-shadow:0 0 10px #0f0; }
  button { padding:12px 20px; font-size:18px; margin:8px 0; cursor:pointer; }
  #start { background:#f00; color:#fff; border:none; }
  #stop { background:#444; color:#fff; border:none; display:none; }
  #crash { background:#900; color:#fff; border:none; }
  label { display:block; margin:10px 0; font-size:16px; }
  input[type=range] { width:100%; }
  #fps { font-size:20px; font-weight:bold; margin:10px 0; }
  #warning { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(255,0,0,0.8); color:#fff; padding:30px; border-radius:10px; text-align:center; font-size:24px; max-width:90%; z-index:20; display:none; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="warning">
  <p>WARNING: This will FUCK your GPU — extreme heat, possible crash, reboot, or permanent damage on weak Android phones.<br>Use at your own risk, bitch.</p>
  <button onclick="document.getElementById('warning').style.display='none'; startStress(8);">I accept, nuke it</button>
</div>

<div id="ui">
  <h1>STRESS MY GPU</h1>
  <button id="start" onclick="startStress(document.getElementById('intensity').value)">START GPU OVERLOAD</button>
  <button id="stop" onclick="stopStress()">STOP (if it lets you)</button>
  <button id="crash" onclick="startStress(10)">CRASH TEST MAX</button>
  <label>Intensity Level (1-10): <input type="range" id="intensity" min="1" max="10" value="5" step="1"></label>
  <label><input type="checkbox" id="cpu" checked> Also fry CPU (Web Workers)</label>
  <div id="fps">FPS: -- | GPU Load: --%</div>
  <div id="info">Android detected? Optimized to kill Mali/Adreno faster.</div>
</div>

<canvas id="c"></canvas>

<script>
// === BASIC SETUP ===
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', {antialias:false, powerPreference:'high-performance'});
if (!gl) { alert('WebGL2 not supported — your phone is already too weak lol'); }

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  gl.viewport(0,0,canvas.width,canvas.height);
});

// Vertex shader — boring passthrough
const vsSource = `#version 300 es
in vec2 aPos;
void main() { gl_Position = vec4(aPos,0.0,1.0); }`;

// Fragment shader — pure evil volumetric raymarching
const fsSource = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 resolution;
uniform float time;
uniform float intensity; // 1-10 multiplier for steps/res

// === HEAVY NOISE FUNCTIONS (12 octaves FBM) ===
float hash(vec3 p) {
  p = fract(p*0.3183099+.1);
  p *= 17.0;
  return fract(p.x*p.y*p.z*(p.x+p.y+p.z));
}

float noise(vec3 x) {
  vec3 i = floor(x), f = fract(x), u = f*f*(3.0-2.0*f);
  return mix(mix(mix(hash(i+vec3(0,0,0)), hash(i+vec3(1,0,0)), u.x),
                 mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), u.x), u.y),
             mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), u.x),
                 mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), u.x), u.y), u.z);
}

float fbm(vec3 p) {
  float f = 0.0, a = 0.5;
  for(int i=0; i<12; i++) { // 12 octaves = death
    f += a * noise(p); p *= 2.01; a *= 0.5;
  }
  return f;
}

// Signed distance / density (procedural hell landscape + fog)
float scene(vec3 p) {
  p.y += sin(p.x*0.5 + time*0.3)*0.8 + cos(p.z*0.7 + time*0.4)*0.6;
  float ground = p.y + 2.0 + fbm(p*0.4 + vec3(time*0.1,0.0,time*0.05))*3.0;
  float clouds = fbm(p*0.3 + vec3(time*0.8, time*0.3, time*1.2))*5.0 - 2.5;
  return min(ground, clouds*0.4); // combine for density
}

// Raymarch — stupidly high steps
vec4 march(vec3 ro, vec3 rd) {
  float t = 0.0, dens = 0.0;
  vec3 col = vec3(0.0);
  int maxSteps = int(800.0 + intensity*400.0); // up to ~5200 steps at max = RIP
  float stepSize = 0.08 / intensity;

  for(int i=0; i<maxSteps; i++) {
    vec3 p = ro + rd * t;
    float h = scene(p);
    if(h < 0.01) h = abs(h)*0.5 + 0.01; // avoid div0
    float delta = max(0.02, h * stepSize);

    // Accumulate density + color with god rays scattering
    float fog = exp(-t*0.02) * 2.0;
    vec3 lightDir = normalize(vec3(1.0, 1.5, -0.5));
    float scat = max(0.0, dot(rd, lightDir))*0.7 + 0.3;
    col += vec3(1.0,0.7,0.4) * dens * delta * scat * fog * (1.0 + fbm(p*3.0 + time)*0.5);

    dens += delta * (1.0 + fbm(p*2.0)*2.0);
    t += delta;

    if(t > 80.0 || dens > 5.0) break; // early out or it never finishes
  }
  return vec4(col * 0.4 + vec3(dens*0.15), 1.0);
}

void main() {
  vec2 uv = (gl_FragCoord.xy - resolution*0.5) / resolution.y;
  vec3 ro = vec3(0.0, 2.0, time*0.5); // moving camera
  vec3 rd = normalize(vec3(uv, 1.5 + sin(time*0.1)*0.2));

  fragColor = march(ro, rd);
}`;

// Compile shaders
function createShader(type, source) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, source);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(sh));
    return null;
  }
  return sh;
}

const vertexShader = createShader(gl.VERTEX_SHADER, vsSource);
const fragmentShader = createShader(gl.FRAGMENT_SHADER, fsSource);

const program = gl.createProgram();
gl.attachShader(program, vertexShader);
gl.attachShader(program, fragmentShader);
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
  console.error(gl.getProgramInfoLog(program));
}

gl.useProgram(program);

// Quad
const posLoc = gl.getAttribLocation(program, 'aPos');
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(posLoc);
gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

// Uniforms
const resLoc = gl.getUniformLocation(program, 'resolution');
const timeLoc = gl.getUniformLocation(program, 'time');
const intLoc = gl.getUniformLocation(program, 'intensity');

let running = false, startTime = 0, animId;
function render(now) {
  if (!running) return;

  const elapsed = (now - startTime) / 1000;

  gl.uniform2f(resLoc, canvas.width, canvas.height);
  gl.uniform1f(timeLoc, elapsed);
  gl.uniform1f(intLoc, parseFloat(document.getElementById('intensity').value));

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  // Fake FPS counter (will drop hard)
  const fps = Math.round(1000 / (now - (window.last||now)));
  window.last = now;
  document.getElementById('fps').textContent = `FPS: ${fps} | GPU Load: 100%+ (pray)`;

  animId = requestAnimationFrame(render);
}

// Start / Stop
function startStress(inten) {
  document.getElementById('start').style.display = 'none';
  document.getElementById('stop').style.display = 'inline';
  document.getElementById('warning').style.display = 'none';

  if (navigator.userAgent.match(/Android/i)) {
    document.getElementById('info').textContent = 'Android detected — maxing out to crash Mali/G76 faster.';
  }

  running = true;
  startTime = performance.now();
  requestAnimationFrame(render);

  // Optional CPU nuke with workers
  if (document.getElementById('cpu').checked) {
    for(let i=0; i< navigator.hardwareConcurrency || 4; i++) {
      new Worker(URL.createObjectURL(new Blob(["onmessage=()=>{while(true){let p=2; while(true){let prime=true; for(let j=2;j<p;j++) if(p%j===0)prime=false; if(prime)postMessage(p); p++;}}"], {type:'text/javascript'})));
    }
  }
}

function stopStress() {
  running = false;
  cancelAnimationFrame(animId);
  document.getElementById('start').style.display = 'inline';
  document.getElementById('stop').style.display = 'none';
}
</script>
</body>
</html>

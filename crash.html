<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>STRESS MY PC GPU - CRASH EDITION</title>
<style>
  body { margin:0; background:#000; color:#f00; font-family:Arial; overflow:hidden; }
  #ui { position:absolute; top:20px; left:20px; z-index:10; background:rgba(0,0,0,0.8); padding:20px; border:3px solid #f00; border-radius:10px; max-width:400px; }
  h1 { margin:0 0 15px; font-size:32px; text-shadow:0 0 15px #f00; }
  button { padding:15px 30px; font-size:20px; margin:10px 5px; cursor:pointer; border:none; }
  #start { background:#c00; color:white; }
  #stop { background:#444; color:white; display:none; }
  select, label { display:block; margin:15px 0; font-size:18px; color:#fff; }
  #stats { font-size:24px; font-weight:bold; margin:15px 0; color:#ff0; }
  #warning { position:fixed; inset:0; background:rgba(255,0,0,0.9); color:white; display:flex; align-items:center; justify-content:center; font-size:28px; text-align:center; padding:40px; z-index:50; flex-direction:column; }
  #warning button { margin-top:20px; background:#000; color:#fff; padding:20px 40px; font-size:24px; }
  canvas { position:fixed; inset:0; }
</style>
</head>
<body>

<div id="warning">
  <div>THIS WILL FUCK YOUR PC — extreme GPU/CPU load, overheating, possible crash, BSOD, reboot, or hardware damage if unstable.<br>Save everything, risk it if you dare.</div>
  <button onclick="document.getElementById('warning').style.display='none';">I accept, nuke my shit</button>
</div>

<div id="ui">
  <h1>STRESS MY PC</h1>
  <select id="mode">
    <option value="gpu">GPU Only (WebGL hell)</option>
    <option value="cpu">CPU Only (Worker nuke)</option>
    <option value="both" selected>CPU & GPU (max crash chance)</option>
  </select>
  <button id="start" onclick="startStress()">START OVERLOAD</button>
  <button id="stop" onclick="stopStress()">STOP (maybe)</button>
  <div id="stats">Status: Idle | FPS: -- | Load: --%</div>
</div>

<canvas id="c"></canvas>

<script>
// === WEBGL SETUP ===
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', {antialias:false, powerPreference:'high-performance'});
if (!gl) alert('No WebGL2 — your PC is pussy anyway');

canvas.width = window.innerWidth * 1.5; // oversize for more load
canvas.height = window.innerHeight * 1.5;
window.addEventListener('resize', () => { canvas.width = innerWidth*1.5; canvas.height = innerHeight*1.5; gl.viewport(0,0,canvas.width,canvas.height); });

// Passthrough VS
const vs = `#version 300 es
in vec2 p; void main(){gl_Position=vec4(p,0,1);}`;

// Evil FS: high-step raymarch + extra compute
const fs = `#version 300 es
precision highp float;
out vec4 o;
uniform vec2 r;
uniform float t;
uniform float load; // intensity fake

float n(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,45.5432)))*43758.5453);}
float fbm(vec3 p){float a=0.5,f=0.; for(int i=0;i<15;i++){a*=0.5; f+=a*n(p); p*=2.1;} return f;}
vec3 scene(vec3 p){return vec3(fbm(p*3.+t*0.5)*5., sin(p.x+t)*2., cos(p.z+t*1.2)*3.);}

void main(){
  vec2 uv=(gl_FragCoord.xy-r*0.5)/r.y;
  vec3 ro=vec3(0,0,-5.+sin(t)*0.5), rd=normalize(vec3(uv,1.8));
  vec3 col=vec3(0); float d=0.;
  for(int i=0;i<int(1200.+load*800.);i++){
    vec3 p=ro+rd*d;
    vec3 dist=scene(p);
    float h=length(dist)-2.5;
    d+=max(0.05,h*0.6);
    col+=vec3(1,0.6,0.3)*0.02*exp(-d*0.1)*fbm(p*10.+t*2.);
    if(d>60.||h<0.001)break;
  }
  o=vec4(col*1.5+vec3(0.1),1);
}`;

let prog = gl.createProgram();
[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs].forEach((s,i)=>{
  let sh=gl.createShader(s[0]); gl.shaderSource(sh,s[1]); gl.compileShader(sh);
  if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(sh));
  gl.attachShader(prog,sh);
});
gl.linkProgram(prog); gl.useProgram(prog);

let buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-3,-3,3,-3,-3,3,3,3]),gl.STATIC_DRAW);
let loc=gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

let resU=gl.getUniformLocation(prog,'r'), timeU=gl.getUniformLocation(prog,'t'), loadU=gl.getUniformLocation(prog,'load');

// Workers for CPU
let workers=[];
function cpuNuke(){
  const blob = new Blob(["onmessage=()=>{let i=2;while(true){let p=true;for(let j=2;j<i;j++)if(i%j===0)p=false;if(p)postMessage(i);i++;}}"], {type:'text/javascript'});
  const url=URL.createObjectURL(blob);
  for(let i=0;i<(navigator.hardwareConcurrency||8)*2;i++){ // double for max fuck
    let w=new Worker(url); workers.push(w);
  }
}

// Render loop
let running=false, st=0, anim;
function loop(now){
  if(!running)return;
  const elapsed=(now-st)/1000;
  gl.uniform2f(resU,canvas.width,canvas.height);
  gl.uniform1f(timeU,elapsed);
  gl.uniform1f(loadU, document.getElementById('mode').value==='gpu'||document.getElementById('mode').value==='both' ? 10 : 2);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

  const fps=Math.round(1000/(now-(window.last||now))); window.last=now;
  document.getElementById('stats').textContent=`Running | FPS: ${fps} (dropping soon) | Load: 100%+ (pray no crash)`;

  anim=requestAnimationFrame(loop);
}

function startStress(){
  document.getElementById('start').style.display='none';
  document.getElementById('stop').style.display='inline';

  canvas.requestFullscreen().catch(e=>console.log('No fullscreen',e));
  document.body.requestPointerLock?.();

  running=true; st=performance.now();
  requestAnimationFrame(loop);

  const m=document.getElementById('mode').value;
  if(m==='cpu'||m==='both') cpuNuke();
}

function stopStress(){
  running=false; cancelAnimationFrame(anim);
  document.getElementById('start').style.display='inline';
  document.getElementById('stop').style.display='none';
  workers.forEach(w=>w.terminate()); workers=[];
  document.exitFullscreen?.(); document.exitPointerLock?.();
}
</script>
</body>
</html>

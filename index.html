<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GPU MURDERER | @prodbyxander</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #06080b;
      color: #e8edf5;
      overflow: hidden;
      user-select: none;
    }
    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.6;
    }
    .glow-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 50%, rgba(124, 58, 237, 0.08) 0%, transparent 70%);
    }
    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 30px 20px;
      gap: 28px;
    }
    .status-badge {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 100px;
      padding: 8px 20px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #8b9bb5;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
      transition: all 0.4s ease;
    }
    .status-badge.active .dot {
      background: #ef4444;
      animation: pulse-dot 0.8s ease-in-out infinite;
    }
    .status-badge.crashed .dot {
      background: #f59e0b;
      animation: pulse-dot 0.4s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.6); opacity: 0.4; }
    }
    .crash-btn {
      position: relative;
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 40%, #5b21b6 100%);
      border: none;
      color: white;
      padding: 22px 52px;
      border-radius: 18px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3), 0 0 60px rgba(124, 58, 237, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      font-family: 'Inter', sans-serif;
      min-width: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .crash-btn::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.5), rgba(236, 72, 153, 0.3));
      z-index: -1;
      filter: blur(8px);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .crash-btn:hover:not(:disabled)::before {
      opacity: 1;
    }
    .crash-btn:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 40px rgba(124, 58, 237, 0.4), 0 0 80px rgba(124, 58, 237, 0.15);
    }
    .crash-btn:active:not(:disabled) {
      transform: translateY(0) scale(0.97);
    }
    .crash-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .crash-btn .icon { font-size: 26px; line-height: 1; }
    .crash-btn .label { position: relative; }
    .crash-btn .label .shine {
      position: absolute;
      top: -20%;
      left: -10%;
      width: 120%;
      height: 140%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      transform: translateX(-100%) rotate(25deg);
      animation: none;
    }
    .crash-btn.running .label .shine {
      animation: shine-sweep 2s ease-in-out infinite;
    }
    @keyframes shine-sweep {
      0% { transform: translateX(-100%) rotate(25deg); }
      100% { transform: translateX(200%) rotate(25deg); }
    }
    .stop-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f87171;
      padding: 14px 36px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
      display: none;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(10px);
    }
    .stop-btn:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      transform: scale(1.03);
    }
    .metrics {
      display: flex;
      gap: 30px;
      padding: 16px 32px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      margin-top: 4px;
      min-width: 320px;
      justify-content: center;
    }
    .metric-item {
      text-align: center;
    }
    .metric-item .value {
      font-size: 22px;
      font-weight: 700;
      color: #e8edf5;
      font-variant-numeric: tabular-nums;
      transition: color 0.3s ease;
    }
    .metric-item .value.danger { color: #ef4444; }
    .metric-item .value.warning { color: #f59e0b; }
    .metric-item .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #6b7d98;
      margin-top: 4px;
    }
    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }
    .footer .creator {
      color: #6b7d98;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
    .footer .creator a {
      color: #8b9bb5;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
      border-bottom: 1px solid rgba(139, 155, 181, 0.15);
      padding-bottom: 2px;
    }
    .footer .creator a:hover {
      color: #a78bfa;
      border-bottom-color: rgba(167, 139, 250, 0.3);
    }
    .footer .subtext {
      color: #4a5a72;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.3px;
      opacity: 0.7;
      text-align: center;
      max-width: 380px;
      line-height: 1.5;
    }
    .keyboard-hint {
      font-size: 11px;
      color: #3a4a62;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: -12px;
    }
    .keyboard-hint kbd {
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 10px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      color: #6b7d98;
      border: 1px solid rgba(255, 255, 255, 0.06);
      font-family: 'Inter', sans-serif;
    }
    .device-badge {
      font-size: 10px;
      color: #4a5a72;
      background: rgba(255,255,255,0.03);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    @media (max-width: 640px) {
      .crash-btn {
        padding: 18px 32px;
        font-size: 18px;
        min-width: 180px;
        border-radius: 14px;
      }
      .crash-btn .icon { font-size: 20px; }
      .metrics {
        gap: 20px;
        padding: 14px 20px;
        min-width: unset;
        width: 100%;
        max-width: 340px;
        flex-wrap: wrap;
      }
      .metric-item .value { font-size: 18px; }
      .status-badge { font-size: 11px; padding: 6px 16px; }
      .footer .subtext { font-size: 11px; max-width: 280px; }
    }
    @media (max-width: 400px) {
      .crash-btn {
        padding: 16px 24px;
        font-size: 16px;
        min-width: 150px;
      }
      .metrics { gap: 12px; padding: 12px 16px; }
      .metric-item .value { font-size: 15px; }
    }
  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>
  <div class="glow-overlay"></div>

  <div class="container">
    <div class="status-badge" id="statusBadge">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Ready</span>
    </div>

    <div class="device-badge" id="deviceBadge">📱 Detecting device...</div>

    <button class="crash-btn" id="crashBtn">
      <span class="icon">⚡</span>
      <span class="label">
        <span class="shine"></span>
        <span id="btnLabel">Crash GPU</span>
      </span>
    </button>

    <button class="stop-btn" id="stopBtn">
      <span>⏹</span> Stop
    </button>

    <div class="metrics" id="metricsPanel">
      <div class="metric-item">
        <div class="value" id="fpsValue">--</div>
        <div class="label">FPS</div>
      </div>
      <div class="metric-item">
        <div class="value" id="timeValue">00:00.000</div>
        <div class="label">Elapsed</div>
      </div>
      <div class="metric-item">
        <div class="value" id="loadValue">0%</div>
        <div class="label">GPU Load</div>
      </div>
    </div>

    <div class="keyboard-hint">
      <kbd>Space</kbd> or <kbd>Enter</kbd> to start · <kbd>Esc</kbd> to stop
    </div>

    <div class="footer">
      <div class="creator">
        Created by <a href="https://github.com/BombedByXander" target="_blank" rel="noreferrer">@prodbyxander</a>
      </div>
      <div class="subtext">
        Made intentionally for Virtual Machines · Use at your own risk
      </div>
    </div>
  </div>

  <script>
    // ─── DETECT IPHONE ──────────────────────────────────────
    const isIPhone = /iPhone|iPad|iPod/.test(navigator.userAgent) || 
                     (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isMobile = /Mobi|Android|iPhone|iPad|iPod/.test(navigator.userAgent);
    
    document.getElementById('deviceBadge').textContent = isIPhone ? '📱 IPHONE MODE - EXTREME TORTURE' : 
                                                         isMobile ? '📱 MOBILE MODE' : '💻 DESKTOP MODE';

    // ─── TORTURE CONFIG ──────────────────────────────────
    const TORTURE = {
      desktop: {
        renderPasses: 6,
        memoryChunks: 300,
        resolutionScale: 6.0,
        gridSize: 80,
        workerCount: 12,
        textureCount: 30
      },
      iphone: {
        renderPasses: 30,        // 30x fill-rate torture
        memoryChunks: 800,       // 800MB memory bomb
        resolutionScale: 10.0,   // 10x resolution
        gridSize: 150,           // 150x150 grid = 22,500 vertices
        workerCount: 20,         // 20 Web Workers
        textureCount: 50         // 50 textures
      }
    };

    const config = isIPhone ? TORTURE.iphone : TORTURE.desktop;

    // ─── BACKGROUND ANIMATION ──────────────────────────────
    (function initBackground() {
      const canvas = document.getElementById('bgCanvas');
      const ctx = canvas.getContext('2d');
      let w, h;
      const particles = [];
      const count = 60;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      class Particle {
        constructor() { this.reset(); }
        reset() {
          this.x = Math.random() * w;
          this.y = Math.random() * h;
          this.size = Math.random() * 2 + 0.5;
          this.speedX = (Math.random() - 0.5) * 0.3;
          this.speedY = (Math.random() - 0.5) * 0.3;
          this.opacity = Math.random() * 0.4 + 0.1;
        }
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          if (this.x < 0 || this.x > w || this.y < 0 || this.y > h) this.reset();
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(124, 58, 237, ${this.opacity})`;
          ctx.fill();
        }
      }

      for (let i = 0; i < count; i++) particles.push(new Particle());

      function animate() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach(p => { p.update(); p.draw(); });
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 180) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(124, 58, 237, ${0.06 * (1 - dist / 180)})`;
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animate);
      }
      animate();
    })();

    // ─── GPU MURDERER ──────────────────────────────────────
    let isRunning = false;
    let crashBtn = document.getElementById('crashBtn');
    let stopBtn = document.getElementById('stopBtn');
    let statusText = document.getElementById('statusText');
    let statusDot = document.getElementById('statusDot');
    let statusBadge = document.getElementById('statusBadge');
    let btnLabel = document.getElementById('btnLabel');
    let fpsValue = document.getElementById('fpsValue');
    let timeValue = document.getElementById('timeValue');
    let loadValue = document.getElementById('loadValue');

    let gl = null;
    let program = null;
    let canvas = null;
    let startTime = 0;
    let animFrameId = null;
    let frameCount = 0;
    let lastFpsUpdate = 0;

    let memoryBomb = [];
    let textureBombs = [];
    let extraBuffers = [];
    let tortureWorkers = [];

    function setStatus(text, type = 'idle') {
      statusText.textContent = text;
      statusBadge.className = 'status-badge';
      if (type === 'running') {
        statusBadge.classList.add('active');
        statusDot.style.background = '#ef4444';
      } else if (type === 'crashed') {
        statusBadge.classList.add('crashed');
        statusDot.style.background = '#f59e0b';
      } else {
        statusDot.style.background = '#22c55e';
      }
    }

    function setMetrics(fps, elapsed, load) {
      if (fps !== undefined && fps > 0) {
        fpsValue.textContent = fps;
        fpsValue.className = 'value' + (fps < 10 ? ' danger' : fps < 25 ? ' warning' : '');
      } else if (fps === 0) {
        fpsValue.textContent = '--';
        fpsValue.className = 'value';
      }
      
      if (elapsed !== undefined) {
        const total = Math.max(0, Math.floor(elapsed));
        const minutes = String(Math.floor(total / 60000)).padStart(2, '0');
        const seconds = String(Math.floor((total % 60000) / 1000)).padStart(2, '0');
        const millis = String(total % 1000).padStart(3, '0');
        timeValue.textContent = `${minutes}:${seconds}.${millis}`;
      }
      
      if (load !== undefined) {
        const l = Math.min(100, Math.round(load));
        loadValue.textContent = l + '%';
        loadValue.className = 'value' + (l > 80 ? ' danger' : l > 50 ? ' warning' : '');
      }
    }

    function setIdle() {
      isRunning = false;
      if (crashBtn) {
        crashBtn.disabled = false;
        crashBtn.className = 'crash-btn';
        btnLabel.textContent = 'Crash GPU';
        document.querySelector('.crash-btn .icon').textContent = '⚡';
      }
      if (stopBtn) stopBtn.style.display = 'none';
      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }

      memoryBomb = [];
      textureBombs = [];
      extraBuffers = [];
      tortureWorkers.forEach(w => { try { w.terminate(); } catch(e) {} });
      tortureWorkers = [];

      if (gl) {
        try {
          for (let i = 0; i < 50; i++) {
            const trash = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, trash);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(1000000), gl.STATIC_DRAW);
            gl.deleteBuffer(trash);
          }
        } catch(e) {}
      }

      setStatus('Ready', 'idle');
      setMetrics(0, 0, 0);
    }

    function createWebGLContext() {
      if (canvas) return true;
      
      canvas = document.createElement('canvas');
      canvas.style.position = 'fixed';
      canvas.style.inset = '0';
      canvas.style.zIndex = '-1';
      canvas.style.pointerEvents = 'none';
      canvas.style.opacity = '0.7';
      document.body.prepend(canvas);

      const scale = config.resolutionScale;
      canvas.width = window.innerWidth * scale;
      canvas.height = window.innerHeight * scale;

      gl = canvas.getContext('webgl2', {
        antialias: false,
        powerPreference: 'high-performance',
        desynchronized: true,
        preserveDrawingBuffer: false,
        failIfMajorPerformanceCaveat: false
      });

      if (!gl) {
        gl = canvas.getContext('webgl', {
          antialias: false,
          powerPreference: 'high-performance',
          preserveDrawingBuffer: false
        });
      }

      if (!gl) {
        setStatus('No WebGL!', 'idle');
        return false;
      }

      const isWebGL2 = gl.getParameter(gl.VERSION).includes('WebGL 2');

      // ─── SUPER BRUTAL SHADER (Works on everything) ──────
      const vsSource = isWebGL2 ? 
        `#version 300 es
        in vec2 a_position;
        in vec3 a_color;
        out vec3 v_color;
        uniform float u_time;
        void main() {
          vec2 pos = a_position;
          float wave = sin(pos.x * 50.0 + u_time * 8.0) * 0.2;
          wave += cos(pos.y * 45.0 + u_time * 7.0) * 0.2;
          wave += sin((pos.x + pos.y) * 60.0 + u_time * 10.0) * 0.15;
          pos += wave;
          gl_Position = vec4(pos, 0.0, 1.0);
          v_color = a_color + vec3(sin(u_time + pos.x * 80.0), cos(u_time + pos.y * 80.0), 0.0) * 0.5;
        }` :
        `
        attribute vec2 a_position;
        attribute vec3 a_color;
        varying vec3 v_color;
        uniform float u_time;
        void main() {
          vec2 pos = a_position;
          float wave = sin(pos.x * 50.0 + u_time * 8.0) * 0.2;
          wave += cos(pos.y * 45.0 + u_time * 7.0) * 0.2;
          pos += wave;
          gl_Position = vec4(pos, 0.0, 1.0);
          v_color = a_color + vec3(sin(u_time + pos.x * 80.0), cos(u_time + pos.y * 80.0), 0.0) * 0.5;
        }`;

      const fsSource = isWebGL2 ?
        `#version 300 es
        precision highp float;
        out vec4 fragColor;
        uniform vec2 u_resolution;
        uniform float u_time;
        uniform int u_pass;

        void main() {
          vec2 uv = gl_FragCoord.xy / u_resolution;
          float t = u_time + float(u_pass) * 0.5;
          
          // EXTREME LOOP TORTURE - 500 iterations
          float v = 0.0;
          for (int i = 0; i < 500; i++) {
            float fi = float(i);
            vec2 uv2 = uv + vec2(sin(t + fi * 0.1) * 0.01, cos(t + fi * 0.1) * 0.01);
            v += sin(uv2.x * 100.0 + t * 10.0 + fi) * cos(uv2.y * 100.0 + t * 8.0 + fi * 0.7);
            v += cos(uv2.x * 80.0 + t * 7.0 + fi * 0.5) * sin(uv2.y * 120.0 + t * 9.0 + fi * 0.3);
            v += tan(sin(uv2.x * 60.0 + t * 5.0 + fi * 0.2) * cos(uv2.y * 60.0 + t * 6.0 + fi * 0.4));
            v = fract(v * 1.6180339887);
            v = pow(abs(v), 1.3);
          }
          
          // More torture - multiple color transformations
          vec3 col = vec3(0.0);
          for (int j = 0; j < 10; j++) {
            float fj = float(j);
            vec2 uv3 = uv + vec2(sin(t * 2.0 + fj), cos(t * 2.0 + fj)) * 0.005;
            float val = sin(uv3.x * 200.0 + t * 20.0 + fj) * cos(uv3.y * 200.0 + t * 15.0 + fj);
            col += vec3(val * 0.1, val * 0.05, val * 0.08);
          }
          
          col += v_color * (0.3 + 0.7 * sin(v * 20.0 + t));
          col += vec3(sin(uv.x * 500.0 + t * 50.0) * 0.05);
          
          // Bloom torture
          float bloom = exp(-length(uv - 0.5) * 5.0) * 0.3;
          col += bloom;
          
          // Extreme color grading
          col = pow(col, vec3(0.7 + 0.3 * sin(t * 0.5)));
          col = col / (col + 0.5);
          col = clamp(col, 0.0, 1.0);
          
          fragColor = vec4(col, 1.0);
        }` :
        // WebGL1 version (also 500 loops but with varying)
        `
        precision highp float;
        varying vec3 v_color;
        uniform vec2 u_resolution;
        uniform float u_time;
        uniform int u_pass;

        void main() {
          vec2 uv = gl_FragCoord.xy / u_resolution;
          float t = u_time + float(u_pass) * 0.5;
          
          // EXTREME LOOP TORTURE - 500 iterations
          float v = 0.0;
          for (int i = 0; i < 500; i++) {
            float fi = float(i);
            vec2 uv2 = uv + vec2(sin(t + fi * 0.1) * 0.01, cos(t + fi * 0.1) * 0.01);
            v += sin(uv2.x * 100.0 + t * 10.0 + fi) * cos(uv2.y * 100.0 + t * 8.0 + fi * 0.7);
            v += cos(uv2.x * 80.0 + t * 7.0 + fi * 0.5) * sin(uv2.y * 120.0 + t * 9.0 + fi * 0.3);
            v += tan(sin(uv2.x * 60.0 + t * 5.0 + fi * 0.2) * cos(uv2.y * 60.0 + t * 6.0 + fi * 0.4));
            v = fract(v * 1.6180339887);
            v = pow(abs(v), 1.3);
          }
          
          vec3 col = vec3(0.0);
          for (int j = 0; j < 10; j++) {
            float fj = float(j);
            vec2 uv3 = uv + vec2(sin(t * 2.0 + fj), cos(t * 2.0 + fj)) * 0.005;
            float val = sin(uv3.x * 200.0 + t * 20.0 + fj) * cos(uv3.y * 200.0 + t * 15.0 + fj);
            col += vec3(val * 0.1, val * 0.05, val * 0.08);
          }
          
          col += v_color * (0.3 + 0.7 * sin(v * 20.0 + t));
          col += vec3(sin(uv.x * 500.0 + t * 50.0) * 0.05);
          
          float bloom = exp(-length(uv - 0.5) * 5.0) * 0.3;
          col += bloom;
          col = pow(col, vec3(0.7 + 0.3 * sin(t * 0.5)));
          col = col / (col + 0.5);
          col = clamp(col, 0.0, 1.0);
          
          gl_FragColor = vec4(col, 1.0);
        }`;

      // Compile shaders
      const vs = gl.createShader(isWebGL2 ? gl.VERTEX_SHADER : gl.VERTEX_SHADER);
      gl.shaderSource(vs, vsSource);
      gl.compileShader(vs);

      const fs = gl.createShader(isWebGL2 ? gl.FRAGMENT_SHADER : gl.FRAGMENT_SHADER);
      gl.shaderSource(fs, fsSource);
      gl.compileShader(fs);

      if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS) || !gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(vs) || gl.getShaderInfoLog(fs));
        setStatus('Shader failed!', 'idle');
        return false;
      }

      program = gl.createProgram();
      gl.attachShader(program, vs);
      gl.attachShader(program, fs);
      gl.linkProgram(program);

      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error(gl.getProgramInfoLog(program));
        setStatus('Link failed!', 'idle');
        return false;
      }

      gl.useProgram(program);

      // ─── MASSIVE GEOMETRY ──────────────────────────────
      const gridSize = config.gridSize;
      const vertices = [];
      const colors = [];
      for (let y = 0; y <= gridSize; y++) {
        for (let x = 0; x <= gridSize; x++) {
          const u = (x / gridSize) * 2 - 1;
          const v = (y / gridSize) * 2 - 1;
          vertices.push(u, v);
          colors.push(Math.random(), Math.random(), Math.random());
        }
      }
      
      const indexData = [];
      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          const i = y * (gridSize + 1) + x;
          indexData.push(i, i + 1, i + gridSize + 1);
          indexData.push(i + 1, i + gridSize + 2, i + gridSize + 1);
        }
      }

      const posBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);

      const posLoc = gl.getAttribLocation(program, 'a_position');
      gl.enableVertexAttribArray(posLoc);
      gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

      const colorBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(colors), gl.STATIC_DRAW);

      const colorLoc = gl.getAttribLocation(program, 'a_color');
      if (colorLoc !== -1) {
        gl.enableVertexAttribArray(colorLoc);
        gl.vertexAttribPointer(colorLoc, 3, gl.FLOAT, false, 0, 0);
      }

      const indexBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indexData), gl.STATIC_DRAW);

      // ─── TEXTURE BOMB ──────────────────────────────────
      try {
        for (let i = 0; i < config.textureCount; i++) {
          const size = isIPhone ? 2048 : 2048;
          const data = new Uint8Array(size * size * 4);
          for (let j = 0; j < data.length; j += 4) {
            data[j] = Math.random() * 255;
            data[j+1] = Math.random() * 255;
            data[j+2] = Math.random() * 255;
            data[j+3] = 255;
          }
          const tex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, size, size, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          textureBombs.push(tex);
        }
      } catch(e) {}

      // ─── MEMORY BOMB ──────────────────────────────────
      try {
        for (let i = 0; i < config.memoryChunks; i++) {
          const size = 1024 * 1024;
          const chunk = new Uint8Array(size);
          for (let j = 0; j < size; j += 4096) {
            chunk[j] = Math.random() * 255;
            chunk[j+1] = Math.random() * 255;
            chunk[j+2] = Math.random() * 255;
          }
          memoryBomb.push(chunk);
        }
      } catch(e) {}

      // ─── WORKER TORTURE ──────────────────────────────
      try {
        const workerCode = `
          let data = new Float64Array(3000000);
          let counter = 0;
          self.onmessage = function(e) {
            if (e.data === 'start') {
              setInterval(() => {
                for (let i = 0; i < data.length; i++) {
                  data[i] = Math.sin(i * 0.001 + counter) * Math.cos(i * 0.002 + counter) * 
                            Math.tan(i * 0.0005 + counter) * Math.sqrt(Math.abs(Math.sin(i * 0.003)));
                  data[i] = data[i] * 1.6180339887 + 0.5;
                  data[i] = Math.fround(data[i]);
                  data[i] = Math.pow(Math.abs(data[i]), 1.3);
                }
                counter += 0.01;
                self.postMessage({ done: true });
              }, 1);
            }
          };
        `;
        for (let i = 0; i < config.workerCount; i++) {
          const blob = new Blob([workerCode], { type: 'text/javascript' });
          const worker = new Worker(URL.createObjectURL(blob));
          worker.postMessage('start');
          tortureWorkers.push(worker);
        }
      } catch(e) {}

      return true;
    }

    function render(now) {
      if (!isRunning || !gl || !program) return;

      const elapsed = (now - startTime) / 1000;
      const heat = Math.min(100, (elapsed / 5) * 50 + 20 + Math.random() * 10);

      // ─── RENDER PASSES ──────────────────────────────────
      for (let pass = 0; pass < config.renderPasses; pass++) {
        gl.viewport(0, 0, canvas.width, canvas.height);
        const resLoc = gl.getUniformLocation(program, 'u_resolution');
        const timeLoc = gl.getUniformLocation(program, 'u_time');
        const passLoc = gl.getUniformLocation(program, 'u_pass');
        
        if (resLoc) gl.uniform2f(resLoc, canvas.width, canvas.height);
        if (timeLoc) gl.uniform1f(timeLoc, elapsed + pass * 0.1);
        if (passLoc) gl.uniform1i(passLoc, pass);
        
        const indexCount = config.gridSize * config.gridSize * 6;
        gl.drawElements(gl.TRIANGLES, indexCount, gl.UNSIGNED_SHORT, 0);
      }

      frameCount++;

      if (now - lastFpsUpdate > 200) {
        const fps = Math.round(frameCount / ((now - lastFpsUpdate) / 1000));
        const load = Math.min(100, Math.round((1 - fps / 60) * 100 + 20));
        setMetrics(fps, now - startTime, load);
        
        if (fps < 3) {
          setStatus(`💀 IPHONE MELTING - ${fps} FPS`, 'running');
        } else if (fps < 8) {
          setStatus(`☠️ GPU DYING - ${fps} FPS`, 'running');
        } else if (fps < 15) {
          setStatus(`🔥 KILLING GPU - ${fps} FPS`, 'running');
        } else {
          setStatus(`⚡ DESTROYING GPU - ${fps} FPS`, 'running');
        }
        
        // Force garbage collection if available
        if (window.gc) {
          try { window.gc(); } catch(e) {}
        }
        
        frameCount = 0;
        lastFpsUpdate = now;
      }

      animFrameId = requestAnimationFrame(render);
    }

    function startNuke() {
      if (isRunning) {
        setIdle();
        setStatus('Stopped - You survived... this time', 'idle');
        return;
      }

      isRunning = true;
      if (crashBtn) {
        crashBtn.className = 'crash-btn running';
        btnLabel.textContent = isIPhone ? '🔥 MELTING IPHONE...' : '💀 KILLING...';
        document.querySelector('.crash-btn .icon').textContent = isIPhone ? '🔥' : '☠️';
      }
      if (stopBtn) stopBtn.style.display = 'flex';
      
      setStatus(isIPhone ? '🔥 IPHONE TORTURE MODE' : '☠️ GPU MURDER INITIATED', 'crashed');
      setMetrics(0, 0, 0);

      if (!createWebGLContext()) {
        setIdle();
        return;
      }

      startTime = performance.now();
      frameCount = 0;
      lastFpsUpdate = startTime;
      requestAnimationFrame(render);
    }

    function stopNuke() {
      setIdle();
      setStatus('Stopped - You survived... this time', 'idle');
      if (stopBtn) stopBtn.style.display = 'none';
      if (crashBtn) {
        crashBtn.className = 'crash-btn';
        btnLabel.textContent = 'Crash GPU';
        document.querySelector('.crash-btn .icon').textContent = '⚡';
      }
    }

    // ─── EVENT LISTENERS ──────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      if (crashBtn) {
        crashBtn.addEventListener('click', startNuke);
      }
      
      if (stopBtn) {
        stopBtn.addEventListener('click', stopNuke);
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          startNuke();
        }
        if (e.key === 'Escape' || e.key === 's' || e.key === 'S') {
          e.preventDefault();
          stopNuke();
        }
      });

      window.addEventListener('resize', () => {
        if (canvas && gl) {
          const scale = config.resolutionScale;
          canvas.width = window.innerWidth * scale;
          canvas.height = window.innerHeight * scale;
          gl.viewport(0, 0, canvas.width, canvas.height);
        }
      });

      setIdle();
    });
  </script>

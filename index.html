<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrashMyPC | @prodbyxander</title>
  <script src="https://unpkg.com/gpu.js@latest/dist/gpu-browser.min.js"></script>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #fff;
    }
    h1 {
      font-size: 4rem;
      color: #ff0044;
      text-shadow: 0 0 30px #ff0044;
      margin-bottom: 40px;
    }
    #crashBtn {
      padding: 40px 80px;
      font-size: 3.5rem;
      font-weight: bold;
      background: linear-gradient(45deg, #ff0044, #ff3366);
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 0 60px #ff0044;
      transition: all 0.2s;
    }
    #crashBtn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 100px #ff0044;
    }
    #crashBtn:active {
      transform: scale(0.95);
    }
    #status {
      margin-top: 40px;
      font-size: 1.8rem;
      color: #00ff9d;
      text-shadow: 0 0 20px #00ff9d;
    }
    #time {
      margin-top: 20px;
      font-size: 2rem;
      color: #ffcc00;
    }
  </style>
</head>
<body>
  <h1>CrashMyPC | @prodbyxander</h1>
  <button id="crashBtn">CRASH GPU NOW</button>
  <div id="status">Waiting for your sacrifice...</div>
  <div id="time">-- ms</div>

<script>
  let worker = null;
  let isRunning = false;

  function initWorker() {
    if (worker) worker.terminate();
    
    const blob = new Blob([`
      importScripts('https://unpkg.com/gpu.js@latest/dist/gpu-browser.min.js');

      let gpu = new GPU({ mode: "gpu" });

      const kernel = gpu.createKernel(function() {
        let t = 0;
        for (let i = 0; i < this.constants.size; i++) {
          t += this.thread.x % 5466587 * (this.thread.x % 6847648) - this.thread.x % 51374684;
          t = t / (this.thread.x % 9769864) * 6541;
          t = Math.exp(t);
          t = Math.sqrt(t);  // reduced nesting - still burns FP units hard
        }
        return t;
      })
      .setOptimizeFloatMemory(true)
      .setImmutable(true)
      .setConstants({ size: 2000 })  // lowered from 10000 to avoid timeout
      .setLoopMaxIterations(2000)
      .setOutput([1, 1]);  // tiny output - no massive buffer allocation

      kernel(); // warm-up once

      let timeoutId;

      onmessage = function(e) {
        if (e.data[0] === "Run") {
          timeoutId = setTimeout(() => {
            postMessage(["BenchResult", 999999]); // fake huge time if hung
            close(); // kill worker
          }, 15000); // 15s max before force-kill

          const start = performance.now();
          kernel();
          const end = performance.now();
          clearTimeout(timeoutId);

          postMessage(["BenchResult", end - start]);
        }
      };
    `], { type: 'text/javascript' });

    worker = new Worker(URL.createObjectURL(blob));

    worker.onmessage = function(e) {
      const [type, value] = e.data;
      if (type === "BenchResult") {
        document.getElementById('time').textContent = value >= 999999 ? "TIMEOUT/HUNG - GPU probably died" : \`\${Math.round(value)} ms\`;
        document.getElementById('status').textContent = value >= 999999 ? "GPU resisted... or crashed silently. Try again or check Task Manager" : "GPU survived (for now) - click to nuke harder";
        isRunning = false;
        document.getElementById('crashBtn').disabled = false;
      }
    };

    worker.onerror = function(err) {
      console.error(err);
      document.getElementById('status').textContent = "Worker crashed: " + (err.message || "Unknown error - GPU driver reset?");
      isRunning = false;
      document.getElementById('crashBtn').disabled = false;
    };
  }

  document.getElementById('crashBtn').onclick = function() {
    if (isRunning) return;
    isRunning = true;
    this.disabled = true;
    document.getElementById('status').textContent = "Nuking GPU... hold on (15s timeout if hung)";
    document.getElementById('time').textContent = "-- ms";

    if (!worker) initWorker();
    worker.postMessage(["Run"]);
  };

  initWorker(); // preload
</script>
  
</body>
</html>

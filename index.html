<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GPU CRASHER | @prodbyxander</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #05060a;
      color: #e8edf5;
      overflow: hidden;
      user-select: none;
    }
    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.5;
    }
    .glow-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.3;
      animation: floatOrb 20s ease-in-out infinite;
    }
    .glow-orb-1 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.3), transparent 70%);
      top: -100px;
      right: -100px;
      animation-delay: 0s;
    }
    .glow-orb-2 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.2), transparent 70%);
      bottom: -50px;
      left: -50px;
      animation-delay: -7s;
    }
    .glow-orb-3 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.15), transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -14s;
    }
    @keyframes floatOrb {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.1); }
      66% { transform: translate(-20px, 30px) scale(0.9); }
    }
    .glow-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 50%, rgba(124, 58, 237, 0.05) 0%, transparent 70%);
    }
    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 30px 20px;
      gap: 24px;
    }
    .logo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .logo-icon {
      font-size: 44px;
      line-height: 1;
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: pulseIcon 3s ease-in-out infinite;
    }
    @keyframes pulseIcon {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .logo-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #e8edf5 0%, #8b9bb5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo-sub {
      font-size: 11px;
      font-weight: 400;
      color: #4a5a72;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .status-badge {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 100px;
      padding: 8px 24px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #8b9bb5;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
      transition: all 0.4s ease;
    }
    .status-badge.active .dot {
      background: #ef4444;
      animation: pulse-dot 0.8s ease-in-out infinite;
    }
    .status-badge.crashed .dot {
      background: #f59e0b;
      animation: pulse-dot 0.4s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.6); opacity: 0.4; }
    }
    .device-badge {
      font-size: 10px;
      color: #4a5a72;
      background: rgba(255, 255, 255, 0.03);
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.4s ease;
      margin-top: -8px;
    }
    .crash-btn {
      position: relative;
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 40%, #5b21b6 100%);
      border: none;
      color: white;
      padding: 22px 52px;
      border-radius: 18px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3), 0 0 60px rgba(124, 58, 237, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      font-family: 'Inter', sans-serif;
      min-width: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .crash-btn::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.5), rgba(236, 72, 153, 0.3));
      z-index: -1;
      filter: blur(8px);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .crash-btn:hover:not(:disabled)::before {
      opacity: 1;
    }
    .crash-btn:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 40px rgba(124, 58, 237, 0.4), 0 0 80px rgba(124, 58, 237, 0.15);
    }
    .crash-btn:active:not(:disabled) {
      transform: translateY(0) scale(0.97);
    }
    .crash-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .crash-btn .icon {
      font-size: 26px;
      line-height: 1;
      transition: transform 0.3s ease;
    }
    .crash-btn.running .icon {
      animation: spin-icon 0.5s linear infinite;
    }
    @keyframes spin-icon {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .crash-btn .label {
      position: relative;
    }
    .crash-btn .label .shine {
      position: absolute;
      top: -30%;
      left: -10%;
      width: 120%;
      height: 160%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      transform: translateX(-100%) rotate(25deg);
      animation: none;
    }
    .crash-btn.running .label .shine {
      animation: shine-sweep 2s ease-in-out infinite;
    }
    @keyframes shine-sweep {
      0% { transform: translateX(-100%) rotate(25deg); }
      100% { transform: translateX(200%) rotate(25deg); }
    }
    .crash-btn .btn-sub {
      font-size: 11px;
      font-weight: 400;
      opacity: 0.6;
      display: block;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }
    .stop-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f87171;
      padding: 14px 40px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
      display: none;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(10px);
    }
    .stop-btn:hover {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.3);
      transform: scale(1.03);
    }
    .metrics {
      display: flex;
      gap: 40px;
      padding: 16px 32px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      min-width: 320px;
      justify-content: center;
    }
    .metric-item {
      text-align: center;
    }
    .metric-item .value {
      font-size: 24px;
      font-weight: 800;
      color: #e8edf5;
      font-variant-numeric: tabular-nums;
      transition: color 0.3s ease;
      letter-spacing: -0.5px;
    }
    .metric-item .value.danger { color: #ef4444; }
    .metric-item .value.warning { color: #f59e0b; }
    .metric-item .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #4a5a72;
      margin-top: 4px;
    }
    .metric-item .unit {
      font-size: 14px;
      font-weight: 400;
      color: #4a5a72;
      margin-left: 2px;
    }
    .load-bar-container {
      width: 100%;
      max-width: 320px;
      height: 4px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      overflow: hidden;
      margin-top: -4px;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .load-bar-container.active {
      opacity: 1;
    }
    .load-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #f59e0b, #ef4444);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }
    .footer .creator {
      color: #4a5a72;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
    .footer .creator a {
      color: #6b7d98;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
      border-bottom: 1px solid rgba(107, 125, 152, 0.15);
      padding-bottom: 2px;
    }
    .footer .creator a:hover {
      color: #a78bfa;
      border-bottom-color: rgba(167, 139, 250, 0.3);
    }
    .footer .subtext {
      color: #3a4a62;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.3px;
      opacity: 0.6;
      text-align: center;
      max-width: 380px;
      line-height: 1.5;
    }
    .keyboard-hint {
      font-size: 11px;
      color: #3a4a62;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: -8px;
    }
    .keyboard-hint kbd {
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 12px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      color: #4a5a72;
      border: 1px solid rgba(255, 255, 255, 0.06);
      font-family: 'Inter', sans-serif;
    }
    @media (max-width: 640px) {
      .crash-btn {
        padding: 18px 36px;
        font-size: 20px;
        min-width: 200px;
        border-radius: 16px;
      }
      .crash-btn .icon { font-size: 22px; }
      .metrics {
        gap: 20px;
        padding: 14px 20px;
        min-width: unset;
        width: 100%;
        max-width: 340px;
        flex-wrap: wrap;
        justify-content: space-around;
      }
      .metric-item .value { font-size: 20px; }
      .status-badge { font-size: 11px; padding: 6px 16px; }
      .footer .subtext { font-size: 11px; max-width: 280px; }
      .logo-title { font-size: 22px; }
      .glow-orb-1 { width: 200px; height: 200px; }
      .glow-orb-2 { width: 150px; height: 150px; }
      .glow-orb-3 { width: 300px; height: 300px; }
    }
    @media (max-width: 400px) {
      .crash-btn {
        padding: 16px 24px;
        font-size: 17px;
        min-width: 160px;
      }
      .metrics { gap: 12px; padding: 12px 16px; }
      .metric-item .value { font-size: 17px; }
    }
  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>
  <div class="glow-orb glow-orb-1"></div>
  <div class="glow-orb glow-orb-2"></div>
  <div class="glow-orb glow-orb-3"></div>
  <div class="glow-overlay"></div>

  <div class="container">
    <div class="logo-section">
      <div class="logo-icon">⚡</div>
      <div class="logo-title">GPU CRASHER</div>
      <div class="logo-sub">Extreme Stress Test</div>
    </div>

    <div class="status-badge" id="statusBadge">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Ready</span>
    </div>

    <div class="device-badge" id="deviceBadge">📱 Detecting device...</div>

    <button class="crash-btn" id="crashBtn">
      <span class="icon">⚡</span>
      <span class="label">
        <span class="shine"></span>
        <span id="btnLabel">Crash GPU</span>
        <span class="btn-sub" id="btnSub">Click to initiate meltdown</span>
      </span>
    </button>

    <button class="stop-btn" id="stopBtn">
      <span>⏹</span> Stop Torture
    </button>

    <div class="metrics" id="metricsPanel">
      <div class="metric-item">
        <div class="value" id="fpsValue">--</div>
        <div class="label">FPS</div>
      </div>
      <div class="metric-item">
        <div class="value" id="timeValue">00:00.000</div>
        <div class="label">Elapsed</div>
      </div>
      <div class="metric-item">
        <div class="value" id="loadValue">0<span class="unit">%</span></div>
        <div class="label">GPU Load</div>
      </div>
    </div>

    <div class="load-bar-container" id="loadBarContainer">
      <div class="load-bar" id="loadBar"></div>
    </div>

    <div class="keyboard-hint">
      <kbd>Space</kbd> or <kbd>Enter</kbd> · <kbd>Esc</kbd> to stop
    </div>

    <div class="footer">
      <div class="creator">
        Created by <a href="https://github.com/BombedByXander" target="_blank" rel="noreferrer">@prodbyxander</a>
      </div>
      <div class="subtext">
        Engineered for virtual machines · Push the limits
      </div>
    </div>
  </div>

  <script src="crasher.js"></script>
  <script>
    // ─── BACKGROUND ANIMATION ──────────────────────────────
    (function initBackground() {
      const canvas = document.getElementById('bgCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w, h;
      const particles = [];
      const count = 60;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      class Particle {
        constructor() { this.reset(); }
        reset() {
          this.x = Math.random() * w;
          this.y = Math.random() * h;
          this.size = Math.random() * 2 + 0.5;
          this.speedX = (Math.random() - 0.5) * 0.3;
          this.speedY = (Math.random() - 0.5) * 0.3;
          this.opacity = Math.random() * 0.4 + 0.1;
        }
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          if (this.x < 0 || this.x > w || this.y < 0 || this.y > h) this.reset();
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(124, 58, 237, ${this.opacity})`;
          ctx.fill();
        }
      }

      for (let i = 0; i < count; i++) particles.push(new Particle());

      function animate() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach(p => { p.update(); p.draw(); });
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 180) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(124, 58, 237, ${0.06 * (1 - dist / 180)})`;
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>
</body>
</html>
